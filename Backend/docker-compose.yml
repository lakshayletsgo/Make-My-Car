version: '3.8'

services:
  # ================================================
  # PostgreSQL Database
  # ================================================
  postgres:
    image: postgres:16-alpine
    container_name: makemycar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-makemycar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-makemycar_secret}
      POSTGRES_DB: ${DB_NAME:-make_my_car}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-makemycar} -d ${DB_NAME:-make_my_car}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - makemycar-network

  # ================================================
  # Backend API
  # ================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makemycar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-makemycar}:${DB_PASSWORD:-makemycar_secret}@postgres:5432/${DB_NAME:-make_my_car}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - makemycar-network

volumes:
  postgres_data:
    driver: local
  api_logs:
    driver: local

networks:
  makemycar-network:
    driver: bridge
