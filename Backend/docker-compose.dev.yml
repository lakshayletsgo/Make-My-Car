version: '3.8'

services:
  # ================================================
  # PostgreSQL Database (Development)
  # ================================================
  postgres:
    image: postgres:16-alpine
    container_name: makemycar-db-dev
    environment:
      POSTGRES_USER: makemycar
      POSTGRES_PASSWORD: makemycar_dev
      POSTGRES_DB: make_my_car
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - makemycar-dev

  # ================================================
  # pgAdmin (Optional - for database management)
  # ================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: makemycar-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@makemycar.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - makemycar-dev

volumes:
  postgres_data_dev:
    driver: local

networks:
  makemycar-dev:
    driver: bridge
